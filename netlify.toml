# ---------------------------------------------------------------
# QVee Wellness — Netlify deployment
# Connect this GitHub repository to Netlify and it just works.
# ---------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Caching + security headers live in the `_headers` file (copied into dist/).
# Canonical redirects and the 404 fallback are in dist/_redirects.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Production context: don't index Netlify preview URLs
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
