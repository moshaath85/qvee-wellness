# ---------------------------------------------------------------
# QVee Wellness — Nginx server block (reference)
# Deploy to /etc/nginx/conf.d/qveewellness.conf
# ---------------------------------------------------------------

# Brotli (if ngx_brotli is available, otherwise rely on gzip)
brotli on;
brotli_comp_level 6;
brotli_types text/html text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

# Gzip fallback
gzip on;
gzip_comp_level 6;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/html text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qveewellness.com qveewellness.com;

    root /var/www/qveewellness;
    index index.html;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://maps.googleapis.com 'sha256-6MEFcyNv1lIMnBu+3gzo8dPTalw1aAPG4LT1v7QkIJY=' 'sha256-81OInM7P4ASd8o5fVvwJn8Ka7ZhOzSPZ6ECOl/Ri/C8=' 'sha256-c06QuusYXj1uPjeH0lTp9zfQjDGEBEXlPFDPddrpKy8=' 'sha256-g7fbMLaT7APg0st5FnuL09BBzb8LbT1JoHduWZeKlFc=' 'sha256-nYQDt042uJ+A3jrh43l7dUQcGNKQi2c+ooxWHuFHBz8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # ---------- Caching ----------
    # Service worker must never be cached (exact match wins)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Build manifest changes every deploy — never cache (exact match wins)
    location = /assets/built/manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Content-hashed bundles — immutable
    location ^~ /assets/built/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Images & logos
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
    }

    # SEO files
    location ~* \.(xml|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML — always revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- Canonical URLs ----------
    if ($host = qveewellness.com) { return 301 https://www.qveewellness.com$request_uri; }
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }
    location ~ ^/(about|practices|membership|visit)/?$ { return 301 /$1.html$is_args$args; }

    # ---------- Static routing ----------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Source maps are served like any other asset (useful for DevTools)
    types {
        application/json map;
        application/manifest+json webmanifest;
    }
}
